# ============================================================
#  节点配置示例 —— 全部语法来自 Loon 官方文档，可直接抄进 [Proxy] 段
#  来源：https://nsloon.app/docs/Node/
#  占位符：HOST / PORT / PASSWORD / UUID / PUBLIC_KEY / SHORT_ID
# ============================================================

[Proxy]

# ---------- Shadowsocks 裸奔（不推荐，仅内网/中转）----------
SS-Plain = Shadowsocks,HOST,443,aes-128-gcm,"PASSWORD",fast-open=true,udp=true,ip-mode=prefer-v4

# ---------- Shadowsocks 2022（更强的重放保护）----------
SS-2022 = Shadowsocks,HOST,443,2022-blake3-aes-128-gcm,"BASE64_PASSWORD",fast-open=true,udp=true

# ---------- Shadowsocks + ShadowTLS v3（给老 SS 续命）----------
# v2 已不可靠，务必用 v3
SS-ShadowTLS = Shadowsocks,HOST,443,aes-128-gcm,"PASSWORD",shadow-tls-password="SHADOW_PASSWORD",shadow-tls-sni=www.example.com,shadow-tls-version=3,udp-port=8443,udp=true

# ---------- ShadowsocksR + ShadowTLS ----------
SSR = ShadowsocksR,HOST,443,aes-256-cfb,"PASSWORD",protocol=auth_aes128_md5,protocol-param=9555:loon,obfs=tls1.2_ticket_auth,obfs-param=download.example.com,udp=true

# ---------- HTTPS 正向代理（有证书的正规中转）----------
HTTPS = https,proxy.example.com,443,"USER","PASSWORD",sni=proxy.example.com,skip-cert-verify=false,tls-profile=safari-ios18,always-use-connect=true

# ---------- SOCKS5 over TLS ----------
SOCKS5-TLS = socks5,HOST,443,"USER","PASSWORD",over-tls=true,sni=HOST,skip-cert-verify=false,tls-profile=chrome,udp=true

# ============================================================
#  以下三种是当前的主流选择
# ============================================================

# ---------- VLESS + XTLS Vision + Reality（首选）----------
# 要点：flow=xtls-rprx-vision 和 Reality 必须一起用，少了 Vision 只做了一半
# tls-profile 必须配，否则握手指纹是默认值，前面白做
VLESS-Reality = VLESS,HOST,443,"UUID",transport=tcp,flow=xtls-rprx-vision,public-key="PUBLIC_KEY",short-id=SHORT_ID,over-tls=true,sni=www.example.com,tls-profile=chrome,udp=true,block-quic=false

# ---------- Trojan + Reality ----------
Trojan-Reality = Trojan,HOST,443,"PASSWORD",transport=tcp,public-key="PUBLIC_KEY",short-id=SHORT_ID,sni=www.example.com,tls-profile=chrome,alpn=h2,fast-open=true,udp=true

# ---------- VMess + Reality（老服务端也能用）----------
VMess-Reality = VMess,HOST,443,auto,"UUID",transport=tcp,alterId=0,public-key="PUBLIC_KEY",short-id=SHORT_ID,over-tls=true,sni=www.example.com,tls-profile=chrome,udp=true

# ---------- Hysteria2 + 端口跳跃 + Salamander ----------
# server-ports 必须是服务端实际开放并映射的整段端口，否则跳到未开端口即断
# download-bandwidth 单位 Mbps，填太小会自己掐自己的带宽
Hysteria2 = Hysteria2,HOST,443,"PASSWORD",sni=HOST,skip-cert-verify=false,alpn="h3",salamander-password=OBFS_PASSWORD,server-ports="20000:20100",hop-interval=30,download-bandwidth=100,fast-open=true,udp=true

# ---------- AnyTLS（对抗 TLS-in-TLS 指纹）----------
AnyTLS = AnyTLS,HOST,443,"PASSWORD",sni=HOST,tls-profile=chrome,idle-session-timeout=30,max-stream-count=8,udp=true

# ---------- AnyTLS + Reality ----------
AnyTLS-Reality = AnyTLS,HOST,443,"PASSWORD",sni=www.example.com,public-key="PUBLIC_KEY",short-id=SHORT_ID,tls-profile=chrome,udp=true

# ---------- WireGuard（真隧道，不是代理）----------
# reserved=[1,2,3] 是 Cloudflare WARP 专用，自建不要填
# allowed-ips 决定哪些流量进隧道；Loon 的规则决定哪些请求用这个节点，两者都要满足
WG = WireGuard,interface-ip=192.168.2.2,private-key="PRIVATE_KEY",mtu=1280,dns=192.168.2.1,keepalive=45,peers=[{public-key="PEER_PUBLIC_KEY",allowed-ips="0.0.0.0/0,::/0",endpoint=wg.example.com:51820}],udp=true

# ---------- 自定义协议（JS 实现握手，Loon 管分流）----------
# 这条路可以自己补 TUIC 之类的缺口，代价是没有原生实现的性能
Custom-Demo = Custom,HOST,443,aes-128-gcm,"PASSWORD",script-path=https://example.com/my-proto.js,sni=HOST,skip-cert-verify=false,tls-profile=chrome

# ============================================================
#  节点域名被污染时的救场参数
#  server-dns 只影响「解析节点服务器域名」，不动普通请求的全局 DNS
#  需要 Loon 3.5.2 (996)+
# ============================================================
# VLESS-Reality-DnsFix = VLESS,HOST,443,"UUID",transport=tcp,flow=xtls-rprx-vision,public-key="PUBLIC_KEY",short-id=SHORT_ID,over-tls=true,sni=www.example.com,tls-profile=chrome,udp=true,server-dns="https://dns.alidns.com/dns-query"
