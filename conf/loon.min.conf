# ============================================================
#  最小可用配置 —— 用来判断「导入失败」到底卡在哪一层
#
#  只保留最确定的键和段。如果这份能导入而 loon.conf 不能，
#  说明完整版里有某个键你的 Loon 版本不认。
#
#  导入方式见 docs/verify.md
# ============================================================

[General]
ipv6 = false
dns-server = 223.5.5.5, 119.29.29.29
real-ip = *.apple.com, *.icloud.com

[Proxy]

[Remote Proxy]

[Proxy Group]
PROXY = select, DIRECT
流媒体 = select, DIRECT
AI = select, DIRECT
社交 = select, DIRECT

[Rule]
GEOIP, CN, DIRECT
FINAL, PROXY

[Remote Rule]
https://cdn.jsdelivr.net/gh/alhza/Weir@main/out/loon/reject.list, policy=REJECT, tag=去广告, enabled=true
https://cdn.jsdelivr.net/gh/alhza/Weir@main/out/loon/direct.list, policy=DIRECT, tag=直连, enabled=true
https://cdn.jsdelivr.net/gh/alhza/Weir@main/out/loon/proxy.list, policy=PROXY, tag=代理, enabled=true
https://cdn.jsdelivr.net/gh/alhza/Weir@main/out/loon/proxy-media.list, policy=流媒体, tag=流媒体, enabled=true
https://cdn.jsdelivr.net/gh/alhza/Weir@main/out/loon/proxy-ai.list, policy=AI, tag=AI, enabled=true
https://cdn.jsdelivr.net/gh/alhza/Weir@main/out/loon/proxy-social.list, policy=社交, tag=社交, enabled=true
