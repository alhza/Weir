# ============================================================
#  Quantumult X 配置骨架
#  把 EXAMPLE_HOST 换成你上传 out/ 的地址。
#  键名以你当前的 QX 版本为准；标 [核对] 的建议对着 App 内导出样例确认一遍。
# ============================================================

[general]
# ---- 连通性探测 ----
network_check_url=http://www.baidu.com
server_check_url=http://cp.cloudflare.com/generate_204

# ---- 分流模式 ----
# filter = 按规则分流
running_mode_trigger=filter, filter, none

# ---- DNS ----
# 与 Loon 同理：域名规则命中时不需要解析，国内 DNS 足够。
dns_server=223.5.5.5, 119.29.29.29
# [核对] 以下为常见键名，按版本可能写作 dns_exclusion_list / dns_exclude
dns_exclusion_list=*.qq.com, *.weixin.qq.com, *.alipay.com

# ---- 关闭 IPv6 ----
no_ipv6=true

# ---- 其他 ----
# [核对] 排除加密的 SNI 探测、UDP 白名单等按需添加
# udp_whitelist=443,80

[policy]
# 策略名必须和 policy.json 里 qx 字段一致。
# static=组名, 候选1, 候选2, ...
static=PROXY, DIRECT
static=流媒体, PROXY, DIRECT

[server_local]
# 单节点写死的地方，一般不用

[server_remote]
# 节点订阅在这里（App 内「节点」页添加亦可）
# https://example.com/sub, tag=机场A, enabled=true

[filter_local]
# ============================================================
#  本地规则区：优先级高于 filter_remote，用来做「逃生舱」。
# ============================================================
# HOST-SUFFIX,example.com,DIRECT
# HOST-SUFFIX,bad-site.com,REJECT

# IP 层：FakeIP 模式下只对裸 IP 请求生效
IP-ASN,4134,DIRECT
IP-ASN,4837,DIRECT
IP-ASN,9808,DIRECT
IP-ASN,4538,DIRECT

GEOIP,CN,DIRECT

# 兜底：与 Loon 一致的取舍（漏网直连 = 故障可见）
FINAL,DIRECT

[filter_remote]
# 由 build.ps1 生成，见 out/qx/_filter_remote.inc
https://EXAMPLE_HOST/rules/qx/reject.list, tag=reject, force-policy=REJECT, enabled=true
https://EXAMPLE_HOST/rules/qx/direct.list, tag=direct, force-policy=DIRECT, enabled=true
https://EXAMPLE_HOST/rules/qx/proxy.list, tag=proxy, force-policy=PROXY, enabled=true
https://EXAMPLE_HOST/rules/qx/media.list, tag=media, force-policy=流媒体, enabled=true

[rewrite_local]
# ^https?://example\.com/api url script-response-body https://EXAMPLE_HOST/scripts/x.js

[rewrite_remote]
# 订阅式复写

[task_local]
# 出口体检：
# 0 8 * * * https://EXAMPLE_HOST/scripts/egress.js, tag=出口体检, enabled=true

[http_backend]
# 面板，按需

[mitm]
hostname = %APPEND% example.com
